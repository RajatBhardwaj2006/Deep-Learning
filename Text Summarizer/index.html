<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Summarizer</title>

    <style>

        /* ------------------------------
           Global
        ------------------------------ */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #faf3e8;
            color: #222;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 50px 20px;
        }


        /* ------------------------------
           Main Container
        ------------------------------ */

        .container {
            width: 700px;
            max-width: 100%;

            padding: 35px;

            background-color: white;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.15);
        }


        /* ------------------------------
           Heading
        ------------------------------ */

        h1 {
            margin: 0;

            text-align: center;

            font-size: 28px;
            font-weight: 700;

            color: #f58a2b;
        }


        .subtitle {
            margin: 5px 0 30px;

            text-align: center;

            font-size: 16px;
            font-weight: 700;

            color: #222;
        }


        /* ------------------------------
           Description
        ------------------------------ */

        .description {
            margin: 0 0 10px;

            font-size: 14px;

            color: #333;
        }


        /* ------------------------------
           Textarea
        ------------------------------ */

        textarea {
            width: 100%;
            height: 200px;

            padding: 14px;

            resize: vertical;

            border: 1px solid #d5d5d5;

            border-radius: 5px;

            outline: none;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            line-height: 1.5;

            color: #333;

            background-color: #fff;
        }


        textarea::placeholder {
            color: #777;
        }


        textarea:focus {
            border-color: #f58a2b;

            box-shadow:
                0 0 0 2px rgba(245, 138, 43, 0.12);
        }


        /* ------------------------------
           Button
        ------------------------------ */

        button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background-color: #ff852b;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: background-color 0.2s ease;
        }


        button:hover {
            background-color: #f4771b;
        }


        button:disabled {
            background-color: #cccccc;

            cursor: not-allowed;
        }


        /* ------------------------------
           Summary
        ------------------------------ */

        .summary {
            margin-top: 25px;

            text-align: center;
        }


        .summary h3 {
            margin: 0 0 10px;

            font-size: 18px;

            font-weight: 700;

            color: #222;
        }


        #summary-text {
            margin: 0;

            padding: 15px;

            min-height: 60px;

            text-align: left;

            font-size: 14px;

            line-height: 1.6;

            color: #333;

            background-color: #fafafa;

            border: 1px solid #e0e0e0;

            border-radius: 5px;
        }


        /* ------------------------------
           Mobile
        ------------------------------ */

        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            textarea {
                height: 180px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- Title -->

        <h1>
            Text Summarizer
        </h1>


        <h3 class="subtitle">
            using HuggingFace Transformer
        </h3>


        <!-- Description -->

        <p class="description">
            Write or paste your content below for quick summarization.
        </p>


        <!-- Input Form -->

        <form id="summarization-form">


            <textarea
                id="dialogue-input"
                placeholder="Enter your content here..."
                required
            ></textarea>


            <button type="submit">
                Summarize
            </button>


        </form>


        <!-- Summary -->

        <div class="summary">


            <h3 id="summary-heading">
                Content Summary
            </h3>


            <p id="summary-text">
                Your summary will appear here.
            </p>


        </div>


    </div>


    <!-- ==========================================
         JavaScript
         ========================================== -->

    <script>


        document
            .getElementById("summarization-form")
            .addEventListener("submit", async (e) => {


                // Prevent normal form submission

                e.preventDefault();


                // Get HTML elements

                const dialogueInput =
                    document.getElementById("dialogue-input");

                const summaryText =
                    document.getElementById("summary-text");

                const submitButton =
                    e.target.querySelector("button");


                // Get user input

                const dialogue =
                    dialogueInput.value.trim();


                // Don't send empty input

                if (!dialogue) {

                    return;

                }


                // Show processing message

                summaryText.innerText =
                    "Processing...";


                // Disable button

                submitButton.disabled = true;


                try {


                    // Send request to FastAPI

                    const response = await fetch(
                        "/summarize/",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                dialogue: dialogue
                            })

                        }
                    );


                    // Check response

                    if (!response.ok) {

                        throw new Error(
                            `Server error: ${response.status}`
                        );

                    }


                    // Convert response to JSON

                    const data =
                        await response.json();


                    // Display summary

                    summaryText.innerText =
                        data.summary ||
                        "No summary returned.";


                }
                catch (err) {


                    // Display error

                    summaryText.innerText =
                        `Error: ${err.message}`;


                }
                finally {


                    // Enable button again

                    submitButton.disabled = false;

                }


            });


    </script>


</body>

</html>
